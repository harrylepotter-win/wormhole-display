name: Build & Release

# Pull requests: unit tests + debug APK artifact.
# Push to main:  signed release APK, republished as the rolling "latest" pre-release.
# Tag vX.Y.Z:    signed release APK published as a GitHub Release.
# (Gitea uses .gitea/workflows/ instead; it takes precedence there.)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.3.13750724
      KEYSTORE_BASE64: ${{ secrets.WORMHOLE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out (full history and tags for versioning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android platform, NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Compute version
        run: |
          scripts/version.sh | tee -a "$GITHUB_ENV"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          if [ "v$WORMHOLE_VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Computed version $WORMHOLE_VERSION_NAME does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Require signing secrets for published builds
        if: github.event_name == 'push' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Repository secret WORMHOLE_KEYSTORE_BASE64 is not set; refusing to publish an unsigned build."
          exit 1

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WORMHOLE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APK
        env:
          WORMHOLE_KEYSTORE_PASSWORD: ${{ secrets.WORMHOLE_KEYSTORE_PASSWORD }}
          WORMHOLE_KEY_ALIAS: ${{ secrets.WORMHOLE_KEY_ALIAS }}
          WORMHOLE_KEY_PASSWORD: ${{ secrets.WORMHOLE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "${WORMHOLE_KEYSTORE_PATH:-}" ]; then
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/wormhole-display.apk
          else
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/wormhole-display.apk
          fi
          (cd dist && sha256sum wormhole-display.apk > wormhole-display.apk.sha256)
          cat dist/wormhole-display.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wormhole-display-${{ env.WORMHOLE_VERSION_NAME }}
          path: dist/wormhole-display.apk*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/wormhole-display.apk dist/wormhole-display.apk.sha256 \
            --verify-tag --generate-notes \
            --title "Wormhole Display $GITHUB_REF_NAME"

      - name: Publish rolling latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" > /dev/null 2>&1 || true
          gh release create latest dist/wormhole-display.apk dist/wormhole-display.apk.sha256 \
            --prerelease --target "$GITHUB_SHA" \
            --title "Wormhole Display (latest main build)" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7} (version $WORMHOLE_VERSION_NAME). For a stable build, use the newest vX.Y.Z release."
